<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ef382b"><title>零食有鸣 · 巡店路线地图</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><b>有鸣<span>巡店地图</span></b><span id="theme">自动日夜</span></div></header><main><div class="intro"><div><p class="eyebrow">广佛门店 / 线下稽核</p><h1>把下一站，安排好。</h1><p>22家门店 · 9月7日—11日 · 按截图巡店日期</p></div><div class="count"><strong>22</strong><span>家门店</span></div></div><aside>门店按截图日期分为5天，并按地理片区排列建议到店顺序。导航按名称匹配，请确认目标门店后出发。</aside><section id="overview" class="overview" aria-label="全部门店检查地图"><div class="overview-head"><div><p class="eyebrow">全部门店总览</p><h2>检查进度地图</h2></div><div class="progress-copy"><strong id="checked-count">0 / 22</strong><span>已检查</span></div></div><div class="progress-track" aria-label="检查进度"><span id="progress-bar"></span></div><div class="overview-controls"><button type="button" class="btn active-filter" id="show-all">全部门店</button><button type="button" class="btn" id="show-unchecked">只看未检查</button><span><i class="legend-dot unchecked-dot"></i>未检查 <i class="legend-dot checked-dot"></i>已检查</span></div><div id="all-map" aria-label="22家门店互动地图"></div><p class="mapnote">高德底图显示全部22家门店。点击标记查看门店并更新检查状态；状态保存在当前设备。</p><div id="overview-list" class="overview-list"></div></section><nav id="days" aria-label="选择巡店日期"></nav><section id="content"></section><footer>巡店日期来自第二张截图，相同行号对应第一张截图的门店。建议顺序按片区减少折返，实时道路路线以地图服务为准。<br>网页无需登录或安装；地图服务的可用性取决于当地网络，语音导航由地图服务提供。</footer></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
